name: Update Notion current positions

on:
  workflow_dispatch:
  schedule:
    # 평일 한국시간 18:40 = UTC 09:40
    - cron: '40 9 * * 1-5'

permissions:
  contents: read

concurrency:
  group: notion-current-positions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Update Notion positions
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_POSITIONS_DATABASE_ID: ${{ secrets.NOTION_POSITIONS_DATABASE_ID }}
          NOTION_POSITIONS_DATA_SOURCE_ID: ${{ secrets.NOTION_POSITIONS_DATA_SOURCE_ID }}
          PORTFOLIO_CASH_KRW: ${{ secrets.PORTFOLIO_CASH_KRW }}
          PORTFOLIO_DEBT_KRW: ${{ secrets.PORTFOLIO_DEBT_KRW }}
          BENCHMARK_TICKER: '^KS11'
          EWMA_DECAY: '0.94'
        run: python -u update_positions.py
